run:
  timeout: 10m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    - goimports      # Check if imports are formatted with goimports
    - gocognit       # Check cognitive complexity
    - revive         # Fast, configurable, extensible, flexible linter (for function/variable naming)
  disable-all: true

linters-settings:
  goimports:
    local-prefixes: DRevolv-backend

  gocognit:
    min-complexity: 10  # Cognitive complexity threshold

  revive:
    min-confidence: 0.8
    rules:
      - name: var-naming         # Variable naming conventions
      - name: function-naming    # Function naming conventions
      - name: exported          # Check that exported items have comments
      - name: package-comments  # Package should have comments

issues:
  max-issues-per-linter: 0
  max-same-issues: 0 