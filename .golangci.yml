run:
  timeout: 10m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true

linters:
  enable:
    - errcheck       # Check for unchecked errors
    - gosimple       # Suggest code simplifications
    - govet          # Report suspicious constructs
    - ineffassign    # Detect ineffectual assignments
    - staticcheck    # Static analysis checks
    - unused         # Check for unused constants, variables, functions and types
    - gofmt          # Check if code is formatted with gofmt
    - goimports      # Check if imports are formatted with goimports
    - misspell       # Find commonly misspelled English words
    - revive         # Fast, configurable, extensible, flexible linter
    - gosec          # Security-focused linter
    - bodyclose      # Check if HTTP response body is closed
    - noctx          # Find sending HTTP request without context.Context
    - rowserrcheck   # Check whether Err of rows is checked successfully
    - sqlclosecheck  # Check that sql.Rows and sql.Stmt are closed
  disable:
    - typecheck      # Disable typecheck as it can be problematic

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  revive:
    min-confidence: 0.8
    rules:
      - name: var-naming
      - name: package-comments
      - name: exported
      - name: var-declaration
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: indent-error-flow
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: unreachable-code
      - name: unused-parameter

  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104 # Audit errors not checked - covered by errcheck

  gofmt:
    simplify: true

  goimports:
    local-prefixes: DRevolv-backend

  misspell:
    locale: US

issues:
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gosec
        - errcheck
    
    # Exclude known linter issues
    - text: "weak cryptographic primitive"
      linters:
        - gosec
    
    # Exclude shadow checking on err variables
    - text: "shadow: declaration of \"err\""
      linters:
        - govet

  max-issues-per-linter: 0
  max-same-issues: 0 