name: Backend CI/CD

on:
  push:
    branches: [ dev, test, prod ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ dev, test, prod ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

env:
  GO_VERSION: '1.24.1'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      working-directory: ./backend
      run: go mod download

    - name: Verify dependencies
      working-directory: ./backend
      run: go mod verify

    - name: Run tests
      working-directory: ./backend
      run: go test -v ./...

    - name: Run tests with coverage
      working-directory: ./backend
      run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.out
        flags: backend
        name: backend-coverage

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        working-directory: backend

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Set environment variables
      run: |
        echo "ENVIRONMENT=$(echo ${{ github.ref_name }})" >> $GITHUB_ENV
        echo "BUILD_VERSION=${{ github.sha }}" >> $GITHUB_ENV

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      working-directory: ./backend
      run: go mod download

    - name: Build application
      working-directory: ./backend
      run: |
        # Build with version and environment info
        go build -v -ldflags "-X main.Version=${{ env.BUILD_VERSION }} -X main.Environment=${{ env.ENVIRONMENT }}" -o ./bin/app ./main.go

    - name: Build for multiple platforms
      working-directory: ./backend
      run: |
        # Build for Linux
        GOOS=linux GOARCH=amd64 go build -v -ldflags "-X main.Version=${{ env.BUILD_VERSION }} -X main.Environment=${{ env.ENVIRONMENT }}" -o ./bin/app-linux-amd64 ./main.go
        # Build for Windows
        GOOS=windows GOARCH=amd64 go build -v -ldflags "-X main.Version=${{ env.BUILD_VERSION }} -X main.Environment=${{ env.ENVIRONMENT }}" -o ./bin/app-windows-amd64.exe ./main.go
        # Build for macOS
        GOOS=darwin GOARCH=amd64 go build -v -ldflags "-X main.Version=${{ env.BUILD_VERSION }} -X main.Environment=${{ env.ENVIRONMENT }}" -o ./bin/app-darwin-amd64 ./main.go
        # Build for macOS ARM64 (Apple Silicon)
        GOOS=darwin GOARCH=arm64 go build -v -ldflags "-X main.Version=${{ env.BUILD_VERSION }} -X main.Environment=${{ env.ENVIRONMENT }}" -o ./bin/app-darwin-arm64 ./main.go

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-binaries-${{ env.ENVIRONMENT }}
        path: backend/bin/
        retention-days: ${{ github.ref_name == 'prod' && 90 || 30 }}

  security:
    runs-on: ubuntu-latest
    # Only run security scans on test and prod branches
    if: github.ref_name == 'test' || github.ref_name == 'prod'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run Gosec Security Scanner
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: '-fmt sarif -out gosec.sarif ./backend/...'

    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: gosec.sarif

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: github.ref_name == 'dev' && github.event_name == 'push'
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-binaries-dev
        path: ./artifacts
    
    - name: Deploy to Development
      run: |
        echo "🚀 Deploying to Development environment..."
        echo "Environment: dev"
        echo "Build Version: ${{ github.sha }}"
        # Add your development deployment steps here
        # Example: Deploy to development server, update dev containers, etc.
        ls -la ./artifacts/

  deploy-test:
    runs-on: ubuntu-latest
    needs: [test, lint, build, security]
    if: github.ref_name == 'test' && github.event_name == 'push'
    environment: testing
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-binaries-test
        path: ./artifacts
    
    - name: Deploy to Testing
      run: |
        echo "🧪 Deploying to Testing environment..."
        echo "Environment: test"
        echo "Build Version: ${{ github.sha }}"
        # Add your testing deployment steps here
        # Example: Deploy to staging server, run integration tests, etc.
        ls -la ./artifacts/

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [test, lint, build, security]
    if: github.ref_name == 'prod' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-binaries-prod
        path: ./artifacts
    
    - name: Pre-deployment checks
      run: |
        echo "🔍 Running pre-deployment checks..."
        # Add pre-deployment validation here
        # Example: Health checks, dependency verification, etc.
    
    - name: Deploy to Production
      run: |
        echo "🚀 Deploying to Production environment..."
        echo "Environment: prod"
        echo "Build Version: ${{ github.sha }}"
        # Add your production deployment steps here
        # Example: Blue-green deployment, rolling updates, etc.
        ls -la ./artifacts/
    
    - name: Post-deployment verification
      run: |
        echo "✅ Running post-deployment verification..."
        # Add post-deployment checks here
        # Example: Health checks, smoke tests, monitoring alerts, etc. 